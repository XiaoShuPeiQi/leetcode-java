name: Deploy algorithm debuggers
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static pages
        run: |
          mkdir -p .work/pages
          cp docs/index.html docs/.nojekyll .work/pages/
          cp -R docs/assets docs/problems .work/pages/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .work/pages
      - uses: actions/deploy-pages@v4
        id: deployment
